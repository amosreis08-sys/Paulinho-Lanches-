<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria Paulinho - Cardápio Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #FFB703;
            --secondary-color: #121620;
            --dark-brown: #3D2314;
            --orange-alert: #E76F51;
            --white: #FFFFFF;
            --light-bg: #F4F6F9;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.08);
            --shadow-lg: 0 16px 36px rgba(0,0,0,0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--light-bg); color: var(--secondary-color); overflow-x: hidden; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* HEADER */
        header {
            background: linear-gradient(180deg, var(--primary-color) 0%, #FFA200 100%);
            padding: 35px 20px 45px 20px;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: var(--shadow-md);
        }
        .logo-frame-container {
            display: inline-block;
            background: var(--white);
            padding: 8px;
            border-radius: 50%;
            box-shadow: var(--shadow-lg);
            border: 4px solid var(--secondary-color);
            margin-bottom: 12px;
            animation: float 4s ease-in-out infinite;
        }
        .logo-circle {
            width: 110px; height: 110px; border-radius: 50%;
            overflow: hidden; background: var(--primary-color);
        }
        .logo-circle img { width: 160%; height: 160%; object-fit: cover; object-position: 50% 30%; margin-left: -30%; margin-top: -8%; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .pizzaria-title { font-size: 1.6rem; font-weight: 800; color: var(--secondary-color); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .pizzaria-tag { color: var(--dark-brown); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 4px; display: block; margin-bottom: 15px; }
        .header-info { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; max-width: 480px; margin: 0 auto; }
        .info-badge { background: rgba(255,255,255,0.9); padding: 8px 16px; border-radius: 30px; font-size: 0.8rem; font-weight: 600; color: var(--secondary-color); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 6px; text-decoration: none; }
        .status-open { background: #25D366; color: var(--white); font-weight: 700; }
        @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
        .pulse-dot { animation: pulse 1.8s infinite; }

        /* CARROSSEL */
        .section-title { padding: 30px 20px 10px 20px; font-size: 1.25rem; font-weight: 700; color: var(--secondary-color); display: flex; align-items: center; gap: 8px; }
        .carousel-container { width: 100%; overflow-x: auto; padding: 10px 20px 25px 20px; display: flex; gap: 16px; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }
        .carousel-card { flex: 0 0 260px; scroll-snap-align: start; background: var(--white); border-radius: 24px; padding: 16px; box-shadow: var(--shadow-md); position: relative; transition: var(--transition); border: 1px solid rgba(0,0,0,0.03); display: flex; flex-direction: column; }
        .carousel-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .badge-destaque { position: absolute; top: 14px; left: 14px; background: var(--orange-alert); color: var(--white); padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 700; z-index: 2; box-shadow: 0 4px 8px rgba(231,111,81,0.3); }
        .pizza-img-container { width: 100%; height: 150px; border-radius: 18px; overflow: hidden; background: #f1f5f9; margin-bottom: 12px; }
        .pizza-img-container img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
        .carousel-card:hover .pizza-img-container img { transform: scale(1.06); }
        .card-stars { color: #FFB703; margin-bottom: 4px; display: flex; gap: 2px; }
        .card-title { font-size: 1rem; font-weight: 700; color: var(--secondary-color); margin-bottom: 8px; }
        .card-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .card-price { font-size: 1.15rem; font-weight: 800; color: var(--secondary-color); }

        /* ABAS */
        .tabs-wrapper { position: sticky; top: 0; background: rgba(244,246,249,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 10; padding: 14px 0; box-shadow: 0 8px 20px rgba(0,0,0,0.02); margin-bottom: 10px; }
        .tabs-container { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-btn { background: var(--white); border: 1px solid rgba(0,0,0,0.05); padding: 10px 22px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; color: #64748b; white-space: nowrap; cursor: pointer; box-shadow: var(--shadow-sm); transition: var(--transition); display: flex; align-items: center; gap: 8px; }
        .tab-btn.active { background: var(--secondary-color); color: var(--primary-color); border-color: var(--secondary-color); box-shadow: 0 6px 15px rgba(18,22,32,0.25); }
        .tab-btn svg { fill: currentColor; }

        /* CARDÁPIO */
        .menu-container { padding: 10px 20px 40px 20px; }
        .menu-section { display: none; animation: fadeInUp 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
        .menu-section.active { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .product-item { background: var(--white); border-radius: 20px; padding: 14px; display: flex; gap: 14px; box-shadow: var(--shadow-sm); border: 1px solid rgba(0,0,0,0.02); align-items: center; transition: var(--transition); }
        .product-item:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .product-img-box { width: 90px; height: 90px; border-radius: 16px; overflow: hidden; background: #f1f5f9; flex-shrink: 0; }
        .product-img-box img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
        .product-item:hover .product-img-box img { transform: scale(1.08); }
        .product-info { flex: 1; min-width: 0; }
        .product-name { font-size: 0.95rem; font-weight: 700; color: var(--secondary-color); margin-bottom: 2px; }
        .product-desc { font-size: 0.75rem; color: #64748b; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-action { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; padding-left: 4px; }
        .product-price { font-size: 1.05rem; font-weight: 800; color: var(--secondary-color); white-space: nowrap; }
        .controls-wrapper { display: flex; align-items: center; gap: 8px; }
        .btn-add-cart { background: var(--primary-color); color: var(--secondary-color); border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(255,183,3,0.3); transition: var(--transition); }
        .btn-add-cart:hover { transform: scale(1.08); background: var(--secondary-color); color: var(--primary-color); }
        .btn-add-cart svg { fill: currentColor; }
        .btn-remove-item { background: #fee2e2; color: #ef4444; border: none; padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; cursor: pointer; display: none; transition: var(--transition); }
        .btn-remove-item:hover { background: #fca5a5; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--secondary-color); height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; box-shadow: 0 -8px 30px rgba(0,0,0,0.25); z-index: 99; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .cart-info-footer { display: flex; align-items: center; gap: 16px; }
        .cart-icon-wrapper { position: relative; background: rgba(255,255,255,0.06); width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .cart-badge-count { position: absolute; top: -6px; right: -6px; background: var(--orange-alert); color: var(--white); font-size: 0.65rem; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .total-box { display: flex; flex-direction: column; }
        .total-box span:first-child { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .total-box span:last-child { font-size: 1.3rem; font-weight: 800; color: var(--white); }
        .btn-view-cart { background: var(--primary-color); color: var(--secondary-color); border: none; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: var(--transition); }
        .btn-view-cart:hover { background: var(--white); transform: translateY(-2px); }

        /* MODAL */
        .cart-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(6px); z-index: 100; display: none; justify-content: center; align-items: flex-end; }
        .cart-modal-content { background: var(--white); width: 100%; max-width: 500px; border-top-left-radius: 32px; border-top-right-radius: 32px; padding: 26px; max-height: 85vh; display: flex; flex-direction: column; animation: slideUp 0.35s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .cart-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #f1f5f9; }
        .cart-modal-header h3 { font-size: 1.2rem; font-weight: 700; }
        .btn-close-modal { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; color: #64748b; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .cart-items-list { overflow-y: auto; flex: 1; margin-bottom: 20px; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f8fafc; gap: 12px; }
        .cart-item-img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
        .cart-item-details h4 { font-size: 0.9rem; font-weight: 600; color: var(--secondary-color); }
        .cart-item-details span { font-size: 0.85rem; color: var(--orange-alert); font-weight: 700; }
        .cart-item-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .btn-qty { background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--secondary-color); transition: var(--transition); }
        .btn-qty:hover { background: #e2e8f0; }
        .btn-checkout-whatsapp { background: #25D366; color: var(--white); border: none; width: 100%; padding: 16px; border-radius: 16px; font-size: 1.05rem; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 6px 20px rgba(37,211,102,0.3); transition: var(--transition); }
        .btn-checkout-whatsapp:hover { transform: translateY(-2px); }

        /* WHATSAPP FLOAT */
        .whatsapp-float { position: fixed; bottom: 95px; right: 20px; background-color: #25D366; width: 54px; height: 54px; border-radius: 50%; box-shadow: 0 4px 16px rgba(37,211,102,0.35); z-index: 98; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: var(--transition); }
        .whatsapp-float:hover { transform: scale(1.1) rotate(8deg); }

        @media(min-width: 768px) {
            .menu-section.active { grid-template-columns: repeat(2,1fr); gap: 20px; }
        }
    </style>
</head>

    const p = produtos.find(p=>p.id===id);
    carrinho[id] ? carrinho[id].qtd++ : (carrinho[id]={...p,qtd:1});

};
window.del = id => { delete carrinho[id]; atualizarUI(); };
window.mudar = (id,d) => {
    if(!carrinho[id]) return;
    carrinho[id].qtd += d;
    if(carrinho[id].qtd<=0) delete carrinho[id];
    atualizarUI();
};

function atualizarUI() {
    let total=0, count=0;
    produtos.forEach(p => {
        const d=document.getElementById(`del-${p.id}`);
        const ic=document.getElementById(`icon-${p.id}`);
        if(d) d.style.display="none";
        if(ic) ic.innerHTML=SVG.plus;
    });
    for(const id in carrinho) {
        const it=carrinho[id];
        count+=it.qtd; total+=it.preco*it.qtd;
        const d=document.getElementById(`del-${id}`);
        const ic=document.getElementById(`icon-${id}`);
        if(d) d.style.display="block";
        if(ic) ic.innerHTML=SVG.check;
    }
    document.getElementById("cart-count").innerText=count;
    const fmt=v=>`R$ ${v.toFixed(2).replace('.',',')}`;
    document.getElementById("cart-total-display").innerText=fmt(total);
    document.getElementById("modal-total-display").innerText=fmt(total);
    document.getElementById("cart-modal-items").innerHTML = Object.keys(carrinho).length===0
